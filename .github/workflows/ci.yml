name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fundly
          POSTGRES_PASSWORD: fundly
          POSTGRES_DB: fundly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundly -d fundly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Kredensial Postgres sekali pakai di runner CI, bukan rahasia.
      TEST_DATABASE_URL: postgres://fundly:fundly@localhost:5432/fundly_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
          working-directory: api
      - name: Tipe OpenAPI sinkron dengan spesifikasi
        run: |
          go generate ./internal/http/apigen/...
          git diff --exit-code -- internal/http/apigen || (echo "::error::Jalankan go generate ./... setelah mengubah api-spec/openapi.yaml" && exit 1)
      - name: Role tiruan Supabase (anon, authenticated)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../scripts/supabase-roles.sql
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: Build server
        run: go build -o /dev/null ./cmd/server

  frontend:
    name: Frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipe OpenAPI sinkron dengan spesifikasi
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || (echo "::error::Jalankan npm run gen:api setelah mengubah api-spec/openapi.yaml" && exit 1)
      - name: Vitest
        run: npm test
      - name: Typecheck dan build
        run: npm run build
      - name: Anggaran bundel (JS awal ≤ 150 KB gzip)
        run: npm run check:bundle

  e2e:
    name: E2E (Playwright, matriks viewport)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fundly
          POSTGRES_PASSWORD: fundly
          POSTGRES_DB: fundly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundly -d fundly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Kredensial Postgres sekali pakai di runner CI, bukan rahasia.
      E2E_DATABASE_URL: postgres://fundly:fundly@localhost:5432/fundly?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Migrasi
        working-directory: api
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: go run ./cmd/migrate
      - name: Build frontend
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Pasang Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - name: Lighthouse CI (mobile, throttled; performa ≥ 90, aksesibilitas ≥ 95)
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: |
          (cd ../../api && go run ./cmd/server > /tmp/server.log 2>&1 &)
          node scripts/serve-dist.cjs > /tmp/serve.log 2>&1 &
          npx --yes wait-on@8 -t 120000 http://localhost:8080/api/v1/healthz http://localhost:4174/masuk
          set +e
          npx --yes @lhci/cli@0.15 collect && npx --yes @lhci/cli@0.15 assert
          status=$?
          set -e
          node scripts/lhci-annotate.mjs
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  sqlc:
    name: sqlc (kode hasil generate sinkron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - name: sqlc diff
        working-directory: api/internal/db
        run: sqlc diff

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Redocly lint
        working-directory: api-spec
        run: npx --yes @redocly/cli@2 lint openapi.yaml
