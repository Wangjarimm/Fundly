# Postgres lokal untuk pengembangan (D-14). Bukan untuk deploy.
# Kredensial di bawah hanya untuk mesin lokal dan tidak dipakai di produksi.
services:
  db:
    image: postgres:17-alpine
    container_name: fundly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundly
      POSTGRES_PASSWORD: fundly
      POSTGRES_DB: fundly
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundly -d fundly"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
