version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
  exclusions:
    paths:
      - internal/db/store # kode hasil sqlc
      - internal/http/apigen # kode hasil oapi-codegen
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
    - goimports
